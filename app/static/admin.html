<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리사무소 화재 모니터링</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #0b0e13;
      --panel: #12161d;
      --panel-2: #171c25;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f0f2f5;
      --dim: #8b95a5;
      --green: #2ecc71;
      --amber: #f2b95c;
      --red: #e53935;
      --darkred: #b71c1c;
      --grey: #6b7280;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Color Emoji", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: clamp(16px, 2.5vw, 32px);
    }
    h1 { font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 600; margin: 0; }
    h2 {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 28px 0 12px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .conn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--dim);
    }
    .conn .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--grey);
    }
    .conn.live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    #clock { font-variant-numeric: tabular-nums; font-weight: 600; }

    /* ---------- 상단 경보 배너 ---------- */
    #alarm-banner { display: none; margin-top: 20px; }
    #alarm-banner.show { display: block; }
    .alarm-card {
      background: linear-gradient(180deg, #3a1010, #250909);
      border: 1px solid var(--red);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
      animation: banner-pulse 1.4s ease-in-out infinite;
    }
    @keyframes banner-pulse {
      0%, 100% { border-color: rgba(229, 57, 53, 0.55); }
      50% { border-color: rgba(229, 57, 53, 1); }
    }
    .alarm-card .top {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    }
    .alarm-card .unit-name { font-size: 1.4rem; font-weight: 700; }
    .alarm-card .elapsed { color: #ffb3b3; font-variant-numeric: tabular-nums; }
    .alarm-card .readings { color: var(--dim); margin: 8px 0 14px; font-size: 0.95rem; }
    .alarm-card .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
    }
    .btn:hover { background: #222835; }
    .btn.primary { background: #c62828; border-color: #e53935; }
    .btn.primary:hover { background: #d32f2f; }
    .btn.ghost { background: transparent; }

    .ack-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(242, 185, 92, 0.16);
      color: var(--amber);
      border: 1px solid rgba(242, 185, 92, 0.4);
    }

    /* ---------- 단지 현황: 동 개요 카드 (한눈에 보기) ---------- */
    .building-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .building-card {
      font: inherit;
      text-align: left;
      color: inherit;
      cursor: pointer;
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 5px solid var(--grey);
      border-radius: 16px;
      padding: 20px 22px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .building-card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.25); }
    .building-card.normal { border-top-color: var(--green); }
    .building-card.warning { border-top-color: var(--amber); }
    .building-card.offline { border-top-color: var(--grey); }
    .building-card.alarm,
    .building-card.escalated { border-top-color: var(--red); animation: banner-pulse 1.2s ease-in-out infinite; }
    .building-card .b-name { font-size: 1.6rem; font-weight: 800; }
    .building-card .b-status { margin-top: 6px; font-size: 0.95rem; font-weight: 700; }
    .building-card .b-status.normal { color: var(--green); }
    .building-card .b-status.warning { color: var(--amber); }
    .building-card .b-status.offline { color: var(--dim); }
    .building-card .b-status.alarm,
    .building-card .b-status.escalated { color: #ff6b6b; }
    .building-card .b-summary { margin-top: 10px; font-size: 0.85rem; color: var(--dim); }

    /* ---------- 동 상세: 층별 세대 목록 ---------- */
    .detail-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .detail-head h3 { margin: 0; font-size: 1.3rem; }
    .detail-head .summary { font-size: 0.85rem; color: var(--dim); }
    .floor-plan {
      display: flex; flex-direction: column; gap: 6px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px;
    }
    .floor-row { display: flex; align-items: center; gap: 8px; }
    .floor-row .floor-label {
      flex: none; width: 36px; text-align: right; font-size: 0.72rem; color: var(--dim);
      font-variant-numeric: tabular-nums;
    }
    .floor-row .units { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .mini-unit {
      min-width: 74px;
      border: 1px solid var(--border);
      border-top: 3px solid var(--grey);
      border-radius: 10px;
      padding: 5px 9px;
      background: var(--panel-2);
      font-size: 0.75rem;
      line-height: 1.4;
    }
    .mini-unit.normal { border-top-color: var(--green); }
    .mini-unit.warning { border-top-color: var(--amber); }
    .mini-unit.alarm { border-top-color: var(--red); animation: banner-pulse 1.2s ease-in-out infinite; }
    .mini-unit.escalated { border-top-color: var(--darkred); }
    .mini-unit.offline { border-top-color: var(--grey); opacity: 0.55; }
    .mini-unit .num { font-weight: 700; }
    .mini-unit .stat { color: var(--dim); }
    .mini-unit.normal .stat { color: var(--green); }
    .mini-unit.warning .stat { color: var(--amber); }
    .mini-unit.alarm .stat, .mini-unit.escalated .stat { color: #ff6b6b; }

    /* ---------- 이력 테이블 ---------- */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 520px; }
    th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--dim); font-weight: 500; background: var(--panel); position: sticky; top: 0; }
    tbody tr:last-child td { border-bottom: none; }
    td.evt-alarm, td.evt-escalated { color: #ff6b6b; font-weight: 600; }
    td.evt-cancelled { color: var(--amber); }

    /* ---------- 데모 패널 ---------- */
    details.demo {
      margin-top: 28px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--dim);
    }
    details.demo summary { cursor: pointer; font-size: 0.85rem; }
    .demo-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .demo-row select, .demo-row input {
      font: inherit; padding: 8px 10px; border-radius: 8px;
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>🏢 관리사무소 화재 모니터링</h1>
    <div class="conn" id="conn">
      <span class="dot"></span><span id="conn-text">연결 중…</span>
      <span id="clock" style="margin-left:14px;color:var(--text)">--:--:--</span>
    </div>
  </header>

  <div id="alarm-banner"></div>

  <h2>세대 현황</h2>
  <div id="grid"></div>

  <h2>이력</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>시각</th><th>세대</th><th>이벤트</th><th>온도</th><th>불꽃</th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>

  <details class="demo">
    <summary>발표 데모용 트리거 (실제 센서 없이 상태 주입 · debug 모드에서만 동작)</summary>
    <div class="demo-row">
      <input id="demo-unit" value="999-999" size="14" placeholder="세대 id (실제 세대 번호와 겹치지 않게)" />
      <button class="btn" data-sim="warning">주의</button>
      <button class="btn" data-sim="alarm">화재경보</button>
      <button class="btn" data-sim="clear">정상 복귀</button>
      <span id="demo-msg"></span>
    </div>
  </details>

  <script>
    const STATUS_KO = {
      normal: "정상", warning: "주의", alarm: "화재경보",
      escalated: "통보됨", offline: "오프라인",
    };
    const ACK_KO = { checking: "현장 확인 중", called_119: "119 신고함" };
    const STATUS_DOT = { normal: "🟢", warning: "🟡", alarm: "🔴", escalated: "🟣", offline: "⚪" };
    const B_STATUS_KO = {
      normal: "정상", offline: "일부 센서 오프라인", warning: "확인 필요",
      alarm: "🔥 화재 경보", escalated: "🔥 관리사무소 통보됨",
    };
    const SEVERITY = { normal: 0, offline: 1, warning: 2, alarm: 3, escalated: 4 };
    const EVENT_KO = {
      "status:warning": "주의 감지", "status:alarm": "화재 경보",
      "status:escalated": "관리사무소 자동 통보", "status:normal": "정상 복귀",
      "status:offline": "센서 오프라인", cancelled: "세대에서 오경보 취소",
      "ack:checking": "현장 확인 중", "ack:called_119": "119 신고함",
      "ack:resolved": "상황 종료",
    };

    let serverSkewMs = 0;
    let units = [];
    let tick = null;
    let selectedBuilding = null; // null = 전체 동 개요, 아니면 그 동의 층별 상세

    const $ = (id) => document.getElementById(id);
    const serverNow = () => Date.now() - serverSkewMs;

    function fmtAgo(iso) {
      if (!iso) return "보고 없음";
      const s = Math.max(0, Math.round((serverNow() - new Date(iso).getTime()) / 1000));
      if (s < 60) return `${s}초 전 보고`;
      return `${Math.floor(s / 60)}분 ${s % 60}초 전 보고`;
    }
    function fmtElapsed(iso) {
      if (!iso) return "";
      const s = Math.max(0, Math.round((serverNow() - new Date(iso).getTime()) / 1000));
      return `경보 발생 ${Math.floor(s / 60)}분 ${String(s % 60).padStart(2, "0")}초 경과`;
    }
    function fmtClock() {
      const d = new Date(serverNow());
      const p = (n) => String(n).padStart(2, "0");
      $("clock").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    // ---- 관리자 토큰 (조치 API 가 401 이면 물어본다) ----
    function authHeaders() {
      const t = localStorage.getItem("fireAdminToken");
      return t ? { "X-Admin-Token": t } : {};
    }
    async function postAck(unitId, action) {
      const res = await fetch("/api/fire/ack", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ unit_id: unitId, action }),
      });
      if (res.status === 401) {
        const t = prompt("관리자 토큰을 입력하세요 (.env 의 FIRE_ADMIN_TOKEN)");
        if (t) { localStorage.setItem("fireAdminToken", t); return postAck(unitId, action); }
      }
      return res.ok;
    }

    // ---- 렌더링 ----
    let sirenActx = null;
    function beep() {
      try {
        sirenActx = sirenActx || new (window.AudioContext || window.webkitAudioContext)();
        if (sirenActx.state === "suspended") sirenActx.resume();
        const o = sirenActx.createOscillator();
        const g = sirenActx.createGain();
        o.type = "square";
        o.frequency.value = 880;
        g.gain.value = 0.06;
        o.connect(g).connect(sirenActx.destination);
        o.start();
        o.stop(sirenActx.currentTime + 0.25);
      } catch (e) {}
    }
    document.addEventListener("click", () => { try { sirenActx && sirenActx.resume(); } catch (e) {} }, { once: true });

    let prevAlarmIds = new Set();
    function render() {
      // 경보 배너
      const alarming = units.filter((u) => u.status === "alarm" || u.status === "escalated");
      const banner = $("alarm-banner");
      banner.classList.toggle("show", alarming.length > 0);
      banner.innerHTML = alarming.map((u) => {
        const temp = u.temperature == null ? "-" : u.temperature.toFixed(1);
        const ack = u.admin_ack ? `<span class="ack-badge">${ACK_KO[u.admin_ack] || u.admin_ack}</span>` : "";
        return `
          <div class="alarm-card">
            <div class="top">
              <span class="unit-name">🔥 ${u.label}</span>
              <span class="elapsed" data-elapsed="${u.alarm_since || ""}">${fmtElapsed(u.alarm_since)}</span>
              ${ack}
              ${u.status === "escalated" ? '<span class="ack-badge" style="color:#ff8a8a;border-color:#ff8a8a;background:rgba(183,28,28,.25)">자동 통보됨</span>' : ""}
            </div>
            <div class="readings">온도 ${temp}°C · 불꽃 ${u.flame ? "감지됨" : "없음"} · 세대 id ${u.unit_id}</div>
            <div class="actions">
              <button class="btn" data-ack="checking" data-unit="${u.unit_id}">현장 확인 중</button>
              <button class="btn primary" data-ack="called_119" data-unit="${u.unit_id}">119 신고함</button>
              <button class="btn ghost" data-ack="resolved" data-unit="${u.unit_id}">상황 종료</button>
            </div>
          </div>`;
      }).join("");

      // 새 경보가 뜨면 알림음
      const nowIds = new Set(alarming.map((u) => u.unit_id));
      for (const id of nowIds) if (!prevAlarmIds.has(id)) beep();
      prevAlarmIds = nowIds;

      // 세대 현황: 기본은 동 3개만 한눈에 보이는 개요, 동을 누르면 그 동의 층별 상세로 드릴다운
      const unitNo = (u) => parseInt((u.unit_id.split("-")[1] || "0"), 10) || 0;
      const buildingOf = (u) => u.unit_id.split("-")[0];

      const byBuilding = new Map();
      for (const u of units) {
        const key = buildingOf(u);
        if (!byBuilding.has(key)) byBuilding.set(key, []);
        byBuilding.get(key).push(u);
      }

      const summarize = (list) => {
        const counts = {};
        for (const u of list) counts[u.status] = (counts[u.status] || 0) + 1;
        return Object.entries(counts).map(([s, n]) => `${STATUS_DOT[s] || "•"} ${n}`).join("  ");
      };
      const worstStatus = (list) =>
        list.reduce((worst, u) => (SEVERITY[u.status] > SEVERITY[worst] ? u.status : worst), "normal");

      // 선택된 동이 사라졌으면(=데이터 아직 없음) 개요로 되돌아간다
      if (selectedBuilding && !byBuilding.has(selectedBuilding)) selectedBuilding = null;

      if (!selectedBuilding) {
        $("grid").innerHTML = `
          <div class="building-overview">
            ${[...byBuilding.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([building, list]) => {
                const top = worstStatus(list);
                return `
                  <button class="building-card ${top}" data-building="${building}" type="button">
                    <div class="b-name">${building}동</div>
                    <div class="b-status ${top}">${B_STATUS_KO[top] || top}</div>
                    <div class="b-summary">${list.length}세대 · ${summarize(list)}</div>
                  </button>`;
              })
              .join("")}
          </div>`;
        return;
      }

      const list = byBuilding.get(selectedBuilding) || [];
      const byFloor = new Map();
      for (const u of list) {
        const floor = Math.floor(unitNo(u) / 100);
        if (!byFloor.has(floor)) byFloor.set(floor, []);
        byFloor.get(floor).push(u);
      }

      // 오름차순: 1층(101,102)이 맨 위, 위층으로 내려갈수록 아래
      const rows = [...byFloor.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([floor, floorUnits]) => {
          const cells = floorUnits
            .slice()
            .sort((a, b) => unitNo(a) - unitNo(b))
            .map((u) => {
              const temp = u.temperature == null ? "-" : `${u.temperature.toFixed(1)}°C`;
              const ago = u.status === "offline" ? "오프라인" : fmtAgo(u.last_report);
              const ack = u.admin_ack ? ` · ${ACK_KO[u.admin_ack] || u.admin_ack}` : "";
              const title = `${u.label} · ${STATUS_KO[u.status] || u.status} · 온도 ${temp} · 불꽃 ${u.flame ? "감지됨" : "없음"} · ${ago}${ack}`;
              return `
                <div class="mini-unit ${u.status}" title="${title}">
                  <div class="num">${unitNo(u)}</div>
                  <div class="stat">${STATUS_KO[u.status] || u.status}</div>
                </div>`;
            })
            .join("");
          return `<div class="floor-row"><span class="floor-label">${floor}F</span><div class="units">${cells}</div></div>`;
        })
        .join("");

      $("grid").innerHTML = `
        <div class="detail-head">
          <button class="btn ghost" data-back-buildings type="button">← 전체 동 보기</button>
          <h3>${selectedBuilding}동</h3>
          <span class="summary">${list.length}세대 · ${summarize(list)}</span>
        </div>
        <div class="floor-plan">${rows}</div>`;
    }

    // 배너 경과시간을 1초마다 갱신 (세대 카드의 "N초 전"은 title 툴팁이라 갱신마다 새로 그려짐)
    function retime() {
      fmtClock();
      document.querySelectorAll("[data-elapsed]").forEach((el) => {
        if (el.dataset.elapsed) el.textContent = fmtElapsed(el.dataset.elapsed);
      });
    }

    document.addEventListener("click", async (e) => {
      const buildingCard = e.target.closest("[data-building]");
      if (buildingCard) {
        selectedBuilding = buildingCard.dataset.building;
        render();
        return;
      }
      if (e.target.closest("[data-back-buildings]")) {
        selectedBuilding = null;
        render();
        return;
      }
      const ackBtn = e.target.closest("[data-ack]");
      if (ackBtn) {
        ackBtn.disabled = true;
        await postAck(ackBtn.dataset.unit, ackBtn.dataset.ack);
        setTimeout(() => { ackBtn.disabled = false; }, 1000);
        return;
      }
      const simBtn = e.target.closest("[data-sim]");
      if (simBtn) {
        const res = await fetch("/api/fire/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ unit_id: $("demo-unit").value.trim(), scenario: simBtn.dataset.sim }),
        });
        $("demo-msg").textContent = res.ok ? "적용됨" : `실패 (${res.status})`;
        setTimeout(() => { $("demo-msg").textContent = ""; }, 2500);
      }
    });

    let lastHistoryLoad = 0;
    async function loadHistory(force) {
      if (!force && Date.now() - lastHistoryLoad < 5000) return;
      lastHistoryLoad = Date.now();
      try {
        const { events } = await (await fetch("/api/fire/events?limit=60")).json();
        $("history").innerHTML = events.map((ev) => {
          const t = new Date(ev.ts);
          const p = (n) => String(n).padStart(2, "0");
          const evtKey = (ev.event || "").split(":")[0];
          const evtLabel = EVENT_KO[ev.event] || ev.event;
          return `<tr>
            <td>${p(t.getMonth() + 1)}/${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}</td>
            <td>${ev.label || ev.unit_id}</td>
            <td class="evt-${evtKey === "status" ? (ev.event.split(":")[1]) : evtKey}">${evtLabel}</td>
            <td>${ev.temperature == null ? "-" : ev.temperature.toFixed(1) + "°"}</td>
            <td>${ev.flame == null ? "-" : (ev.flame ? "감지" : "없음")}</td>
          </tr>`;
        }).join("");
      } catch (e) {}
    }

    function ingest(data) {
      if (data.server_time) serverSkewMs = Date.now() - new Date(data.server_time).getTime();
      units = (data.units || []).slice().sort((a, b) => a.unit_id.localeCompare(b.unit_id));
      render();
    }

    function connect() {
      const es = new EventSource("/api/fire/stream");
      es.onopen = () => { $("conn").classList.add("live"); $("conn-text").textContent = "실시간 연결됨"; };
      es.onmessage = (ev) => {
        try { ingest(JSON.parse(ev.data)); loadHistory(); } catch (e) {}
      };
      es.onerror = () => { $("conn").classList.remove("live"); $("conn-text").textContent = "재연결 중…"; };
    }

    connect();
    loadHistory();
    retime();
    tick = setInterval(retime, 1000);
    // 폴백: SSE 가 막혀도 최소한의 갱신
    setInterval(async () => {
      try {
        const r = await fetch("/api/fire/units");
        if (r.ok) ingest(await r.json());
      } catch (e) {}
    }, 8000);
    setInterval(loadHistory, 20000);
  </script>
</body>
</html>
