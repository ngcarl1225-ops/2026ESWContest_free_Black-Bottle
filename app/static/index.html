<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현관 스마트 비서</title>
  <style>
    :root {
      --bg-0: #0b0e13;
      --bg-1: #12161d;
      --sky-top: #12161d;
      --sky-mid: #12161d;
      --sky-bottom: #0b0e13;
      --card-bg: rgba(9, 12, 18, 0.55);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f0f2f5;
      --text-dim: #8b95a5;
      --accent-blue: #6fa8ff;
      --accent-amber: #f2b95c;
      --accent-dust: #d9a06a;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Pretendard", sans-serif;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-bottom));
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background 3s linear;
    }

    /* ---------- 시간대(하늘) 배경 위에 덮이는 날씨 어둡기 오버레이 ---------- */
    #weather-dim {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: #05060a;
      opacity: 0;
      transition: opacity 2s ease;
    }

    /* ---------- 배경 날씨 효과 ---------- */
    #weather-fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .drop {
      position: absolute;
      top: -10%;
      width: 1.5px;
      height: 55px;
      background: linear-gradient(to bottom, transparent, rgba(150, 190, 255, 0.55));
      opacity: 0;
      animation: fall-rain linear infinite;
      transition: opacity 0.8s;
    }
    body[data-scene="rain"] .drop { opacity: 1; }

    @keyframes fall-rain {
      to { transform: translateY(115vh); }
    }

    .flake {
      position: absolute;
      top: -6%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      opacity: 0;
      animation: fall-snow linear infinite;
      transition: opacity 0.8s;
    }
    body[data-scene="snow"] .flake { opacity: 0.9; }

    @keyframes fall-snow {
      to { transform: translateY(115vh) translateX(var(--drift, 0px)); }
    }

    /* 해/달: 시간대(낮/밤) + 날씨 씬에 따라 JS가 opacity·색·위치를 계산해서 인라인으로 반영 */
    .sun-glow {
      position: absolute;
      right: -6%;
      width: 42vw;
      height: 42vw;
      max-width: 480px;
      max-height: 480px;
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0;
      transition: opacity 2.5s ease, top 3s linear, background 3s linear;
    }

    /* 별: --star-factor(시간대×씬)를 #weather-fx에서 상속받아 각 별의 --peak와 곱해서 밝기 결정 */
    #weather-fx {
      --star-factor: 0;
      --night-factor: 0;
    }
    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: #fffdf5;
      box-shadow: 0 0 4px 1px rgba(255, 253, 245, 0.95), 0 0 9px 2px rgba(255, 246, 223, 0.55);
      opacity: calc(var(--peak, 0.9) * var(--star-factor, 0));
      animation: twinkle ease-in-out infinite;
      transition: opacity 2.5s ease;
    }

    @keyframes twinkle {
      0%, 100% { opacity: calc(var(--peak, 0.9) * var(--star-factor, 0) * 0.4); }
      50% { opacity: calc(var(--peak, 0.9) * var(--star-factor, 0)); }
    }

    /* 흐림/구름많음: 뭉게구름 덩어리(puff) 여러 개를 겹쳐 자연스러운 실루엣을 만든 뒤 통째로 드리프트 */
    .cloud {
      position: absolute;
      opacity: 0;
      animation: drift-cloud linear infinite;
      transition: opacity 1.5s;
    }
    body[data-scene="cloudy"] .cloud { opacity: 0.95; }
    body[data-scene="partly-cloudy"] .cloud { opacity: 0.55; }

    .cloud .puff {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95), rgba(205, 214, 228, 0.5) 65%, transparent 100%);
      filter: blur(5px) brightness(calc(1 - var(--night-factor, 0) * 0.45));
      transition: filter 3s linear;
    }

    @keyframes drift-cloud {
      from { transform: translateX(-25vw); }
      to { transform: translateX(125vw); }
    }

    /* ---------- 미세먼지 헤이즈 오버레이 ---------- */
    #haze-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      backdrop-filter: blur(1.5px) saturate(75%);
      background: radial-gradient(ellipse at 50% 20%, rgba(191, 168, 122, 0.16), rgba(120, 110, 95, 0.22));
      transition: opacity 2s ease;
    }
    #haze-overlay.active { opacity: 1; }

    /* ---------- 레이아웃 ---------- */
    .page {
      position: relative;
      z-index: 2;
      padding: clamp(20px, 3vw, 44px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: clamp(24px, 3vh, 40px);
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      font-weight: 400;
      margin: 0;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    .time-block {
      text-align: right;
    }

    #clock {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      line-height: 1.1;
    }

    #date {
      font-size: clamp(0.85rem, 1.4vw, 1.1rem);
      color: var(--text-dim);
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: clamp(14px, 1.6vw, 22px);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: clamp(20px, 2.2vw, 28px);
      min-height: 150px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-blue);
      opacity: 0.7;
    }
    .card.air::before { background: var(--accent-dust); }
    .card.uv::before { background: var(--accent-amber); }

    .card h2 {
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      font-weight: 400;
      color: var(--text-dim);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card .icon { font-size: 1.1em; }

    .card .main-value {
      font-size: clamp(2rem, 3.6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card .sub-value {
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      color: var(--text-dim);
      margin-top: 10px;
      line-height: 1.7;
    }

    .card.notifications,
    .card.forecast {
      grid-column: 1 / -1;
    }

    .hourly-strip {
      display: flex;
      gap: clamp(6px, 1vw, 14px);
    }

    .hour-item {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    .hour-item .hour-label {
      font-size: clamp(0.75rem, 1vw, 0.9rem);
      color: var(--text-dim);
    }

    .hour-item .hour-icon {
      font-size: clamp(1.3rem, 2.2vw, 1.8rem);
    }

    .hour-item .hour-temp {
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      font-weight: 600;
    }

    .hour-item .hour-pop {
      font-size: clamp(0.7rem, 0.95vw, 0.85rem);
      color: var(--accent-blue);
    }

    .notifications ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .notifications li {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 12px 22px;
      font-size: clamp(0.95rem, 1.3vw, 1.15rem);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notifications .empty {
      color: #5c6577;
      font-size: 1rem;
      border: none;
      background: none;
      padding: 4px 0;
    }

    .mock-badge {
      display: inline-block;
      font-size: 0.7rem;
      color: #f2c078;
      background: rgba(242, 185, 92, 0.14);
      border: 1px solid rgba(242, 185, 92, 0.3);
      border-radius: 6px;
      padding: 3px 8px;
      margin-left: 10px;
      vertical-align: middle;
      font-weight: 500;
    }

    footer.spacer { flex: 1; }

    /* ---------- 세로(포트레이트) 모니터 대응 ---------- */
    @media (orientation: portrait) {
      body {
        font-size: 1.15em;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .time-block { text-align: left; }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 130px;
      }

      #clock { font-size: clamp(2.2rem, 9vw, 3.4rem); }

      .hourly-strip {
        overflow-x: auto;
        justify-content: flex-start;
      }

      .hour-item {
        flex: 0 0 auto;
        min-width: 72px;
      }
    }
  </style>
</head>
<body>
  <div id="weather-dim"></div>
  <div id="weather-fx"></div>
  <div id="haze-overlay"></div>

  <div class="page">
    <header>
      <h1>현관 스마트 비서</h1>
      <div class="time-block">
        <div id="clock">--:--</div>
        <div id="date">-</div>
      </div>
    </header>

    <div class="grid">
      <div class="card weather" id="card-weather">
        <h2><span class="icon">🌤️</span>날씨</h2>
        <div class="main-value">--</div>
        <div class="sub-value">불러오는 중...</div>
      </div>

      <div class="card air" id="card-air">
        <h2><span class="icon">🌫️</span>미세먼지</h2>
        <div class="main-value">--</div>
        <div class="sub-value">불러오는 중...</div>
      </div>

      <div class="card uv" id="card-uv">
        <h2><span class="icon">☀️</span>자외선</h2>
        <div class="main-value">--</div>
        <div class="sub-value">불러오는 중...</div>
      </div>

      <div class="card forecast" id="card-forecast">
        <h2><span class="icon">🕐</span>시간대별 예보</h2>
        <div class="hourly-strip"></div>
      </div>

      <div class="card notifications" id="card-notifications">
        <h2><span class="icon">🔔</span>오늘의 알림</h2>
        <ul></ul>
      </div>
    </div>

    <footer class="spacer"></footer>
  </div>

  <script>
    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      document.getElementById("clock").textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById("date").textContent =
        `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${WEEKDAYS[now.getDay()]}요일`;
      renderSky();
    }

    // ---------- 날씨 파티클 배경 (전부 로드 시 한 번만 생성, 보이기/숨기기는 opacity로) ----------
    const fx = document.getElementById("weather-fx");

    function buildRainDrops(count = 70) {
      for (let i = 0; i < count; i++) {
        const d = document.createElement("div");
        d.className = "drop";
        d.style.left = `${Math.random() * 100}%`;
        d.style.animationDuration = `${0.6 + Math.random() * 0.6}s`;
        d.style.animationDelay = `${-Math.random() * 2}s`;
        fx.appendChild(d);
      }
    }

    function buildSnowFlakes(count = 50) {
      for (let i = 0; i < count; i++) {
        const f = document.createElement("div");
        f.className = "flake";
        const size = 2 + Math.random() * 4;
        f.style.width = `${size}px`;
        f.style.height = `${size}px`;
        f.style.left = `${Math.random() * 100}%`;
        f.style.setProperty("--drift", `${(Math.random() - 0.5) * 100}px`);
        f.style.animationDuration = `${4 + Math.random() * 4}s`;
        f.style.animationDelay = `${-Math.random() * 6}s`;
        fx.appendChild(f);
      }
    }

    let sunGlowEl = null;

    function buildSparkles(count = 70) {
      sunGlowEl = document.createElement("div");
      sunGlowEl.className = "sun-glow";
      fx.appendChild(sunGlowEl);

      for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        // 대부분은 작은 별, 가끔 눈에 띄는 큰 별이 섞이도록
        const isBright = Math.random() < 0.15;
        const size = isBright ? 3 + Math.random() * 2 : 1.5 + Math.random() * 1.5;
        s.style.width = `${size}px`;
        s.style.height = `${size}px`;
        s.style.left = `${Math.random() * 100}%`;
        s.style.top = `${Math.random() * 60}%`;
        s.style.setProperty("--peak", `${isBright ? 0.9 + Math.random() * 0.1 : 0.55 + Math.random() * 0.35}`);
        s.style.animationDuration = `${2 + Math.random() * 3}s`;
        s.style.animationDelay = `${-Math.random() * 4}s`;
        fx.appendChild(s);
      }
    }

    function buildClouds(count = 6) {
      for (let i = 0; i < count; i++) {
        const c = document.createElement("div");
        c.className = "cloud";
        const width = 16 + Math.random() * 22;
        c.style.width = `${width}vw`;
        c.style.height = `${width * (0.32 + Math.random() * 0.1)}vw`;
        c.style.top = `${4 + Math.random() * 28}%`;
        c.style.animationDuration = `${55 + Math.random() * 45}s`;
        c.style.animationDelay = `${-Math.random() * 90}s`;

        // 뭉게구름 덩어리 여러 개를 가로로 겹쳐 배치: 가운데는 크고 둥글게, 가장자리는 작게
        const puffCount = 5 + Math.floor(Math.random() * 3);
        for (let p = 0; p < puffCount; p++) {
          const puff = document.createElement("span");
          puff.className = "puff";
          const t = puffCount === 1 ? 0.5 : p / (puffCount - 1);
          const bell = 1 - Math.abs(t - 0.5) * 1.6;
          const size = 36 + bell * 42 + Math.random() * 12;
          puff.style.width = `${size}%`;
          puff.style.height = `${size * 0.85}%`;
          puff.style.left = `${t * 100 - size / 2 + (Math.random() * 6 - 3)}%`;
          puff.style.bottom = `${Math.random() * 18}%`;
          c.appendChild(puff);
        }
        fx.appendChild(c);
      }
    }

    buildRainDrops();
    buildSnowFlakes();
    buildSparkles();
    buildClouds();

    function computeScene(precipitationType, sky) {
      if (precipitationType.includes("눈")) return "snow";
      if (precipitationType.includes("비") || precipitationType.includes("소나기")) return "rain";
      if (sky === "흐림") return "cloudy";
      if (sky === "구름많음") return "partly-cloudy";
      return "clear";
    }

    // ---------- 시간대(하늘) 연속 그라디언트: 실제 하루처럼 새벽→일출→낮→노을→밤을 자연스럽게 보간 ----------
    const SKY_KEYFRAMES = [
      { hour: 0,    top: "#05070d", mid: "#080b15", bottom: "#0b0e18", glow: "#c3d2ff", glowOpacity: 0.22, glowY: 18, star: 0.9 },
      { hour: 5,    top: "#0a0e1c", mid: "#131a30", bottom: "#1e2740", glow: "#ffcf9e", glowOpacity: 0.15, glowY: 92, star: 0.7 },
      { hour: 6.5,  top: "#223058", mid: "#7a5f74", bottom: "#e08a5c", glow: "#ffb37a", glowOpacity: 0.65, glowY: 78, star: 0.12 },
      { hour: 8.5,  top: "#2b4a78", mid: "#4f7bab", bottom: "#a9c6dd", glow: "#ffe4a8", glowOpacity: 0.55, glowY: 55, star: 0 },
      { hour: 12,   top: "#1c3a63", mid: "#3f6fa0", bottom: "#bcd6e8", glow: "#fff3d0", glowOpacity: 0.5,  glowY: 16, star: 0 },
      { hour: 16.5, top: "#22406c", mid: "#5178a0", bottom: "#d9b98a", glow: "#ffdca0", glowOpacity: 0.55, glowY: 45, star: 0 },
      { hour: 18.5, top: "#2a2350", mid: "#a1517a", bottom: "#f0834f", glow: "#ff9d5c", glowOpacity: 0.7,  glowY: 82, star: 0.1 },
      { hour: 20,   top: "#12132c", mid: "#2c2650", bottom: "#4a3a5c", glow: "#d98fae", glowOpacity: 0.3,  glowY: 94, star: 0.5 },
    ];

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function lerpColor(c1, c2, t) {
      const a = hexToRgb(c1), b = hexToRgb(c2);
      return rgbToHex([lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]);
    }

    function getSkyState(now) {
      const hourFrac = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
      let i = SKY_KEYFRAMES.length - 1;
      for (let j = 0; j < SKY_KEYFRAMES.length; j++) {
        if (SKY_KEYFRAMES[j].hour <= hourFrac) i = j;
      }
      const k1 = SKY_KEYFRAMES[i];
      const k2 = SKY_KEYFRAMES[(i + 1) % SKY_KEYFRAMES.length];
      const span = ((k2.hour - k1.hour) + 24) % 24 || 24;
      const progressed = ((hourFrac - k1.hour) + 24) % 24;
      const t = Math.min(progressed / span, 1);

      return {
        top: lerpColor(k1.top, k2.top, t),
        mid: lerpColor(k1.mid, k2.mid, t),
        bottom: lerpColor(k1.bottom, k2.bottom, t),
        glow: lerpColor(k1.glow, k2.glow, t),
        glowOpacity: lerp(k1.glowOpacity, k2.glowOpacity, t),
        glowY: lerp(k1.glowY, k2.glowY, t),
        star: lerp(k1.star, k2.star, t),
      };
    }

    function isNightHour(hourFrac) {
      return hourFrac < 6.5 || hourFrac >= 18.5;
    }

    // 날씨 씬이 하늘(해/달/별)을 얼마나 가리는지, 전체적으로 얼마나 어둡게 덮는지
    const SCENE_SKY_FACTOR = { clear: 1, "partly-cloudy": 0.6, cloudy: 0.15, rain: 0.1, snow: 0.25 };
    const SCENE_DIM = { clear: 0, "partly-cloudy": 0.12, cloudy: 0.28, rain: 0.35, snow: 0.15 };

    let currentScene = "clear";

    function renderSky() {
      const now = new Date();
      const state = getSkyState(now);
      const factor = SCENE_SKY_FACTOR[currentScene] ?? 1;

      document.body.style.setProperty("--sky-top", state.top);
      document.body.style.setProperty("--sky-mid", state.mid);
      document.body.style.setProperty("--sky-bottom", state.bottom);

      fx.style.setProperty("--star-factor", state.star * factor);
      fx.style.setProperty("--night-factor", state.star);

      if (sunGlowEl) {
        sunGlowEl.style.opacity = state.glowOpacity * factor;
        sunGlowEl.style.top = `${state.glowY - 15}%`;
        sunGlowEl.style.background = `radial-gradient(circle, ${state.glow}55, transparent 72%)`;
      }

      document.getElementById("weather-dim").style.opacity = SCENE_DIM[currentScene] ?? 0;
    }

    function applyScene(scene) {
      currentScene = scene;
      document.body.dataset.scene = scene;
      renderSky();
    }

    function applyHazeEffect(khaiGrade) {
      const hazy = khaiGrade === "나쁨" || khaiGrade === "매우나쁨";
      document.getElementById("haze-overlay").classList.toggle("active", hazy);
    }

    updateClock();
    setInterval(updateClock, 1000);

    function setCard(id, mainText, subHtml, mock) {
      const card = document.getElementById(id);
      card.querySelector(".main-value").innerHTML =
        mainText + (mock ? '<span class="mock-badge">MOCK</span>' : "");
      card.querySelector(".sub-value").innerHTML = subHtml;
    }

    function setCardError(id) {
      const card = document.getElementById(id);
      card.querySelector(".main-value").textContent = "오류";
      card.querySelector(".sub-value").textContent = "정보를 불러올 수 없습니다";
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} -> ${res.status}`);
      return res.json();
    }

    const SCENE_ICONS_STATIC = {
      rain: "🌧️",
      snow: "❄️",
      cloudy: "☁️",
    };

    // 맑음/구름많음은 그 시각이 낮인지 밤인지에 따라 해/달 아이콘을 다르게 표시
    function getSceneIcon(scene, hourFrac) {
      if (scene === "clear") return isNightHour(hourFrac) ? "🌙" : "☀️";
      if (scene === "partly-cloudy") return isNightHour(hourFrac) ? "☁️" : "⛅";
      return SCENE_ICONS_STATIC[scene];
    }

    function renderHourly(hourly) {
      const strip = document.querySelector(".hourly-strip");
      if (!hourly || hourly.length === 0) {
        strip.innerHTML = '<span style="color:var(--text-dim)">예보 데이터가 없습니다</span>';
        return;
      }
      strip.innerHTML = hourly
        .map((h) => {
          const hour = parseInt(h.time.slice(0, 2), 10);
          const hourLabel = `${hour}시`;
          const scene = computeScene(h.precipitation_type, h.sky);
          const icon = getSceneIcon(scene, hour);
          const popHtml = h.precipitation_probability >= 30 ? `<div class="hour-pop">${h.precipitation_probability}%</div>` : "";
          return `
            <div class="hour-item">
              <div class="hour-label">${hourLabel}</div>
              <div class="hour-icon">${icon}</div>
              <div class="hour-temp">${Math.round(h.temperature)}°</div>
              ${popHtml}
            </div>`;
        })
        .join("");
    }

    async function refreshWeather() {
      try {
        const w = await fetchJson("/api/weather");
        const scene = computeScene(w.precipitation_type, w.sky);
        const now = new Date();
        const hourFrac = now.getHours() + now.getMinutes() / 60;
        document.querySelector("#card-weather .icon").textContent = getSceneIcon(scene, hourFrac);
        setCard(
          "card-weather",
          `${w.temperature}°C`,
          `${w.sky} · 강수확률 ${w.precipitation_probability}% · ${w.precipitation_type}<br>습도 ${w.humidity}%`,
          w.mock
        );
        applyScene(scene);
        renderHourly(w.hourly);
      } catch (e) {
        setCardError("card-weather");
      }
    }

    async function refreshAir() {
      try {
        const a = await fetchJson("/api/air-quality");
        setCard(
          "card-air",
          a.khai_grade,
          `PM10 ${a.pm10}㎍/㎥ · PM2.5 ${a.pm25}㎍/㎥`,
          a.mock
        );
        applyHazeEffect(a.khai_grade);
      } catch (e) {
        setCardError("card-air");
      }
    }

    async function refreshUv() {
      try {
        const u = await fetchJson("/api/uv");
        setCard("card-uv", u.grade, `자외선지수 ${u.uv_index}`, u.mock);
      } catch (e) {
        setCardError("card-uv");
      }
    }

    const NOTIFICATION_ICONS = {
      rain_umbrella: "☂️",
      rain_window: "🪟",
      snow_caution: "🥶",
      shower_caution: "☔",
      heatwave: "🥵",
      icy_road: "🧊",
      coldwave: "🧣",
      dry_air: "💧",
      dust_mask: "😷",
      dust_severe: "🚫",
      air_good: "🌿",
      uv_sunscreen: "🧴",
      uv_extreme: "🧢",
    };

    async function refreshNotifications() {
      const list = document.querySelector("#card-notifications ul");
      try {
        const { notifications } = await fetchJson("/api/notifications");
        if (notifications.length === 0) {
          list.innerHTML = '<li class="empty">특별한 알림이 없습니다</li>';
        } else {
          list.innerHTML = notifications
            .map((n) => `<li>${NOTIFICATION_ICONS[n.id] || "•"} ${n.message}</li>`)
            .join("");
        }
      } catch (e) {
        list.innerHTML = '<li class="empty">알림을 불러올 수 없습니다</li>';
      }
    }

    function refreshAll() {
      refreshWeather();
      refreshAir();
      refreshUv();
      refreshNotifications();
    }

    refreshAll();
    setInterval(refreshAll, 5 * 60 * 1000); // 5분마다 갱신
  </script>
</body>
</html>
